version: '3.9'
services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://mvpos:mvpos@db:5432/mvpos_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=cambiar_en_produccion_minimo_32_chars
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - BCRYPT_ROUNDS=12
      - ENVIRONMENT=development
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://127.0.0.1:5173","http://localhost:8080"]
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mvpos
      POSTGRES_PASSWORD: mvpos
      POSTGRES_DB: mvpos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  celery_worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://mvpos:mvpos@db:5432/mvpos_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=cambiar_en_produccion_minimo_32_chars
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

volumes:
  postgres_data:
