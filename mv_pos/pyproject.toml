[tool.poetry]
name = "mv_pos"
version = "0.1.0"
description = "Backend MV-POS Magic Village con Clean Architecture y FastAPI"
authors = ["Magic Village Team <dev@magicvillage.co>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111"
"uvicorn[standard]" = "^0.23"
sqlalchemy = "^2.0"
asyncpg = "^0.28"
alembic = "^1.12"
pydantic = { version = "^2.7", extras = ["dotenv"] }
pydantic-settings = "^2.1"
python-dotenv = "^1.0"
"python-jose[cryptography]" = "^3.4"
"passlib[bcrypt]" = "^1.7.4"
python-multipart = "^0.0.32"
bcrypt = ">=4.2,<5"
redis = "^5.0"
celery = "^5.4"
httpx = "^0.27"
psycopg2-binary = "^2.9"
aiomysql = "^0.2"

[tool.poetry.dev-dependencies]
pytest = "^8.4"
pytest-asyncio = "^0.22"
black = "^24.3"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"
